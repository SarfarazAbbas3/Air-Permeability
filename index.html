<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M10 24h28a6 6 0 1 0-6-6M10 34h40a6 6 0 1 1-6 6M10 44h22' stroke='%2322d3ee' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1220; --bg2:#101a2e; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.10);
  --tx:#eaf2ff; --mut:#8fa3c4; --acc:#22d3ee; --acc2:#818cf8; --warn:#fbbf24;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#eef3fb; --bg2:#ffffff; --card:rgba(255,255,255,.85); --card-b:rgba(15,23,42,.10);
  --tx:#0f1b33; --mut:#5b6b88; --acc:#0891b2; --acc2:#4f46e5; --warn:#b45309;
  --shadow:0 10px 30px rgba(30,50,90,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;transition:background .4s,color .4s}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 16s ease-in-out infinite}
.b1{width:320px;height:320px;background:var(--acc);top:-100px;left:-80px}
.b2{width:280px;height:280px;background:var(--acc2);bottom:-80px;right:-60px;animation-delay:-6s}
.b3{width:200px;height:200px;background:#f472b6;top:45%;left:55%;opacity:.18;animation-delay:-11s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;animation:down .7s cubic-bezier(.2,.9,.3,1) both}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
.logo i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px rgba(34,211,238,.35)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--card-b);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);transition:transform .2s}
.iconbtn:active{transform:scale(.88) rotate(15deg)}
@keyframes down{from{opacity:0;transform:translateY(-16px)}}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}}

.hero{position:relative;margin-top:10px;border-radius:24px;overflow:hidden;border:1px solid var(--card-b);background:linear-gradient(160deg,var(--bg2),var(--bg));box-shadow:var(--shadow);animation:up .8s .1s cubic-bezier(.2,.9,.3,1) both}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:20px 18px 18px}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);font-weight:700}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.big input{font-size:clamp(34px,11vw,48px);font-weight:800;font-variant-numeric:tabular-nums;font-family:inherit;color:var(--acc);background:rgba(34,211,238,.10);border:0;border-bottom:3px dashed var(--acc);border-radius:12px 12px 0 0;padding:2px 10px;min-width:2.2ch;max-width:100%;outline:none;caret-color:var(--acc2);transition:background .25s,box-shadow .25s;animation:pulse 2.4s ease-in-out 1.2s 2}
.big input:focus{background:rgba(34,211,238,.2);box-shadow:0 0 0 4px rgba(34,211,238,.18);border-bottom-style:solid}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,211,238,.22)}}
.big span{color:var(--mut);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--card-b);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;font-family:inherit}
.chip:active{transform:scale(.92)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}

.panel{margin-top:12px;border-radius:20px;border:1px solid var(--card-b);background:var(--card);backdrop-filter:blur(14px);padding:12px;animation:up .8s .2s cubic-bezier(.2,.9,.3,1) both}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:rgba(127,150,190,.14);border-radius:12px;padding:3px;position:relative;flex:1;min-width:200px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-weight:700;font-size:13px;padding:9px 6px;border-radius:10px;cursor:pointer;position:relative;z-index:1;transition:color .25s;font-family:inherit}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg[data-v="exact"] .pill{transform:translateX(100%)}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.field input,.field select{background:rgba(127,150,190,.14);border:1px solid transparent;border-radius:10px;color:var(--tx);padding:8px 10px;font-size:14px;font-weight:700;width:72px;outline:none;font-family:inherit}
.field select{width:auto}
.field input:focus,.field select:focus{border-color:var(--acc)}
.note{font-size:12px;color:var(--mut);margin:10px 2px 0;line-height:1.5}
.collapse{max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .35s}
.collapse.open{max-height:140px;opacity:1}

.search{position:relative;margin:14px 0 6px;animation:up .8s .3s cubic-bezier(.2,.9,.3,1) both}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--card-b);background:var(--card);color:var(--tx);font-size:15px;outline:none;backdrop-filter:blur(10px);font-family:inherit}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}

.list{display:grid;gap:10px;margin-top:8px}
.card{position:relative;border-radius:18px;border:1px solid var(--card-b);background:var(--card);backdrop-filter:blur(12px);padding:12px 12px 10px;overflow:hidden;animation:up .6s cubic-bezier(.2,.9,.3,1) both;transition:border-color .25s,box-shadow .25s,transform .25s}
.card.active{border-color:var(--acc);box-shadow:0 0 0 3px rgba(34,211,238,.18),var(--shadow)}
.card.flash::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(34,211,238,.25),transparent);transform:translateX(-100%);animation:sweep .7s ease;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}
.card .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.unit{font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.2px}
.unit em{font-style:normal;color:var(--mut);font-weight:600;margin-left:6px;font-size:11px}
.acts{display:flex;gap:4px}
.mini{width:32px;height:32px;border-radius:10px;border:0;background:rgba(127,150,190,.14);color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mini:active{transform:scale(.8)}
.mini.on{color:var(--warn);background:rgba(251,191,36,.16)}
.mini.on svg{fill:currentColor}
.card input{width:100%;margin-top:4px;background:none;border:0;outline:none;color:var(--tx);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 0;font-family:inherit}
.card .f{font-size:11px;color:var(--mut);margin-top:2px;font-weight:600}
.card.manual{background:linear-gradient(135deg,rgba(250,204,21,.22),rgba(250,204,21,.08));border-color:#facc15}
.card.manual input{color:#facc15}
:root[data-theme="light"] .card.manual input{color:#a16207}
.tag{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;background:#facc15;color:#1f1700;font-size:9px;font-weight:800;letter-spacing:.8px;vertical-align:middle}
.card.out input{cursor:default}
.empty{text-align:center;color:var(--mut);padding:30px 0;display:none}
.hist{margin-top:16px}
.hist h4{margin:0 0 6px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}

.foot{margin-top:26px;text-align:center;animation:up .8s .5s both}
.dev{display:inline-flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px;border-radius:22px;border:1px solid var(--card-b);background:var(--card);backdrop-filter:blur(14px);width:100%}
.dev .by{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:700}
.dev .nm{font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2),#f472b6,var(--acc));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.btns{display:flex;gap:10px;width:100%}
.btns a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;color:#fff;font-weight:700;font-size:14px;text-decoration:none;transition:transform .2s}
.btns a:active{transform:scale(.94)}
.call{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.wa{background:linear-gradient(135deg,#25d366,#128c7e)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,120px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;transition:transform .4s cubic-bezier(.3,1.4,.5,1);box-shadow:var(--shadow);max-width:90vw;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="wrap">
  <div class="top">
    <div class="logo">
      <i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h8"/></svg></i>
      <div>Air Permeability<small>Unit Converter</small></div>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">
      <svg id="themeIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></svg>

        <a class="wa" href="https://wa.me/923283363738" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5 13.4c-.2.6-1.2 1.100-1.700 1.200-.5.1-1 .2-3.200-.7a10.800 10.800 0 0 1-4.500-4c-.4-.5-1.100-1.500-1.100-2.700s.7-2 1-2.200c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.200 1.600 1.900 1.100 1 2 1.300 2.300 1.400.3.2.5.1.6-.1l.9-1c.2-.2.4-.2.6-.1l1.900.9c.3.1.5.2.5.3.1.2.1.8-.1 1.400z"/></svg>WhatsApp</a>

<script>
"use strict";
/* base = l/m²/s ; value = base * mult
   sheet = factors exactly as in the Excel sheet
   exact = physical conversion (area-based units use test area A in cm²) */
const UNITS = [
  {id:"cm3",  u:"cm³/cm²/s", n:"cubic cm / cm² / sec", sheet:1/10,   exact:()=>0.1,                 fs:"÷ 10"},
  {id:"m3min",u:"m³/m²/min", n:"cubic m / m² / min",   sheet:1/16.7, exact:()=>0.06,                fs:"÷ 16.7"},
  {id:"m3h",  u:"m³/m²/h",   n:"cubic m / m² / hour",  sheet:3.61,   exact:()=>3.6,                 fs:"× 3.61"},
  {id:"lm2s", u:"l/m²/s",    n:"litre / m² / sec",     sheet:1,      exact:()=>1,                   fs:"base unit"},
  {id:"ldm2s",u:"l/dm²/s",   n:"litre / dm² / sec",    sheet:1/99,   exact:()=>0.01,                fs:"÷ 99"},
  {id:"ldm2m",u:"l/dm²/min", n:"litre / dm² / min",    sheet:1/1.7,  exact:()=>0.6,                 fs:"÷ 1.7"},
  {id:"cfm",  u:"cfm",       n:"cubic feet / min",     sheet:1/235,  exact:A=>A/10000*2.118880,     fs:"÷ 235", area:true},
  {id:"dm3s", u:"dm³/s",     n:"cubic dm / sec",       sheet:1/500,  exact:A=>A/10000,              fs:"÷ 500", area:true},
  {id:"cfmft",u:"cfm/ft²",   n:"cfm per sq. foot",     sheet:1/5.09, exact:()=>0.196850394,         fs:"÷ 5.09"},
  {id:"mms",  u:"mm/s",      n:"millimetre / sec",     sheet:1,      exact:()=>1,                   fs:"× 1"},
  {id:"lmin", u:"l/min",     n:"litre / minute",       sheet:1/8.31, exact:A=>A/10000*60,           fs:"÷ 8.31", area:true},
  {id:"m3m",  u:"m³/min",    n:"cubic m / minute",     sheet:1/5000, exact:A=>A/10000*0.06,         fs:"÷ 5000", area:true},
];
const PRESETS=[10,25,50,100,200,300,500,1000];
const $=s=>document.querySelector(s);
const S={base:100, mode:"sheet", area:20, dec:"auto", fav:[], hist:[], theme:"dark", active:"lm2s"};

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const saved=store.get("apc_v1"); if(saved&&typeof saved==="object") Object.assign(S,saved);
const persist=()=>store.set("apc_v1",{mode:S.mode,area:S.area,dec:S.dec,fav:S.fav,hist:S.hist,theme:S.theme,base:S.base});

const mult=u=> S.mode==="sheet"? u.sheet : u.exact(S.area);
const fmt=v=>{
  if(!isFinite(v)) return "";
  if(v===0) return "0";
  const a=Math.abs(v);
  if(S.dec!=="auto") return v.toFixed(+S.dec);
  if(a>=1e9||a<1e-5) return v.toExponential(4);
  const d=a>=1000?2:a>=100?3:a>=1?4:6;
  return String(parseFloat(v.toFixed(d)));
};

const big=$("#bigVal");
const fit=()=>{big.style.width=Math.max(2.2,big.value.length*0.62+1.2)+"em"};
big.addEventListener("input",()=>{
  const v=parseFloat(big.value.replace(",",".").trim());
  fit(); if(isNaN(v)||v<0) return;
  S.base=v; updateAll(null,true); pushHist(); persist();
});
big.addEventListener("focus",()=>setTimeout(()=>big.select(),0));
big.addEventListener("blur",()=>{big.value=fmt(S.base);fit()});
const list=$("#list"); let els={};
function build(){
  list.innerHTML=""; els={};
  const order=[...UNITS].sort((a,b)=>(S.fav.includes(b.id)?1:0)-(S.fav.includes(a.id)?1:0));
  order.forEach((u,i)=>{
    const c=document.createElement("div"); c.className="card"; c.dataset.id=u.id; c.dataset.s=(u.u+" "+u.n).toLowerCase();
    c.style.animationDelay=(0.05*i+0.3)+"s";
    c.innerHTML=`<div class="h"><div class="unit">${u.u}<em>${u.n}</em></div>
      <div class="acts">
        <button class="mini ${S.fav.includes(u.id)?"on":""}" data-a="fav" aria-label="Pin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.2 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></button>
        <button class="mini" data-a="copy" aria-label="Copy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      </div></div>
      <input inputmode="decimal" autocomplete="off" aria-label="${u.u}">
      <div class="f"></div>`;
    {const i=c.querySelector("input");i.readOnly=true;i.setAttribute("inputmode","none");c.classList.add("out")}
    list.appendChild(c); els[u.id]={card:c,input:c.querySelector("input"),f:c.querySelector(".f"),shown:0,raf:0};
    wire(u,c);
  });
  updateAll(null,true); mark();
}
function wire(u,c){
  const inp=els[u.id].input;
  inp.addEventListener("focus",()=>{S.active=u.id;mark();setTimeout(()=>inp.select(),0)});
  inp.addEventListener("input",()=>{
    const raw=inp.value.replace(",",".").trim(); const v=parseFloat(raw);
    if(raw===""||isNaN(v)) return;
    cancelAnimationFrame(els[u.id].raf);
    S.base=v/mult(u); updateAll(u.id); pushHist(); persist();
  });
  c.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    ripple(b,e);
    if(b.dataset.a==="copy"){copy(inp.value+" "+u.u)}
    if(b.dataset.a==="fav"){
      const i=S.fav.indexOf(u.id); i<0?S.fav.push(u.id):S.fav.splice(i,1); persist();
      toast(i<0?"★ Pinned to top":"Unpinned"); if(navigator.vibrate)navigator.vibrate(15);
      const q=$("#q").value; build(); $("#q").value=q; filter();
    }
  });
}
function mark(){for(const id in els)els[id].card.classList.toggle("active",id===S.active)}

const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function tween(id,to,instant){
  const e=els[id]; cancelAnimationFrame(e.raf);
  const from=e.shown, t0=performance.now(), D=(instant||reduce)?0:550;
  if(!D){e.shown=to;e.input.value=fmt(to);return}
  const step=t=>{const p=Math.min(1,(t-t0)/D), k=1-Math.pow(1-p,4);
    const v=p>=1?to:from+(to-from)*k; e.input.value=fmt(v); e.shown=v;
    if(p<1)e.raf=requestAnimationFrame(step)};
  e.raf=requestAnimationFrame(step);
}
let speed=.4;
function updateAll(except,instant){
  UNITS.forEach(u=>{
    const v=S.base*mult(u), e=els[u.id];
    e.f.textContent=S.mode==="sheet" ? "Sheet factor: "+u.fs : "Exact: ×"+parseFloat(mult(u).toPrecision(6))+(u.area?"  (A = "+S.area+" cm²)":"");
    if(u.id===except){e.shown=v;return}
    tween(u.id,v,instant);
    if(!instant){e.card.classList.remove("flash");void e.card.offsetWidth;e.card.classList.add("flash")}
  });
  if(document.activeElement!==big){big.value=fmt(S.base);fit()}
  presetsMark(); speed=Math.min(1,Math.log10(Math.max(1,S.base)+1)/3.2);
}

function buildPresets(){
  const p=$("#presets"); p.innerHTML="";
  PRESETS.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v;b.dataset.v=v;
    b.onclick=e=>{ripple(b,e);S.base=v;S.active="lm2s";mark();updateAll();pushHist();persist()};p.appendChild(b)});
}
function presetsMark(){document.querySelectorAll("#presets .chip").forEach(c=>c.classList.toggle("on",+c.dataset.v===S.base))}
let ht;function pushHist(){clearTimeout(ht);ht=setTimeout(()=>{
  const v=+S.base.toPrecision(6); S.hist=[v,...S.hist.filter(x=>x!==v)].slice(0,8); drawHist(); persist()},1400)}
function drawHist(){
  const box=$("#hist"); box.innerHTML=""; $("#histBox").style.display=S.hist.length?"block":"none";
  S.hist.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v+" l/m²/s";
    b.onclick=e=>{ripple(b,e);S.base=v;updateAll();window.scrollTo({top:0,behavior:"smooth"})};box.appendChild(b)});
}

function setMode(m){
  S.mode=m; const seg=$("#seg"); seg.dataset.v=m;
  seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("#areaBox").classList.toggle("open",m==="exact");
  updateAll(null,false); persist();
}
$("#seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)});
$("#area").addEventListener("input",e=>{const a=parseFloat(e.target.value);if(a>0){S.area=a;updateAll(null,true);persist()}});
$("#dec").addEventListener("change",e=>{S.dec=e.target.value;updateAll(null,true);persist()});
function filter(){const q=$("#q").value.trim().toLowerCase();let n=0;
  document.querySelectorAll(".card").forEach(c=>{const ok=!q||c.dataset.s.includes(q);c.style.display=ok?"":"none";if(ok)n++});
  $("#empty").style.display=n?"none":"block"}
$("#q").addEventListener("input",filter);

const SUN='<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content=t==="dark"?"#0b1220":"#eef3fb";
  $("#themeIco").innerHTML=t==="dark"?SUN:MOON; persist()}
$("#themeBtn").onclick=()=>setTheme(S.theme==="dark"?"light":"dark");

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
function copy(txt){
  const done=()=>{toast("Copied: "+txt);if(navigator.vibrate)navigator.vibrate(12)};
  const fb=()=>{const a=document.createElement("textarea");a.value=txt;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb();
}
function ripple(el,e){const r=document.createElement("span");r.className="ripple";const b=el.getBoundingClientRect(),s=Math.max(b.width,b.height);
  const x=(e&&e.clientX)?e.clientX-b.left:b.width/2, y=(e&&e.clientY)?e.clientY-b.top:b.height/2;
  r.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;
  el.style.position="relative";el.style.overflow="hidden";el.appendChild(r);setTimeout(()=>r.remove(),600)}

/* airflow canvas: particles flow through a fabric mesh; speed follows the value */
const cv=$("#air"),cx=cv.getContext("2d");let W=0,H=0,P=[];
function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;
  P=Array.from({length:Math.round(W/9)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.6,v:Math.random()*.7+.4}))}
function draw(){
  cx.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue("--acc").trim(),mut=cs.getPropertyValue("--mut").trim();
  const mx=W*.74;
  cx.globalAlpha=.3;cx.strokeStyle=mut;cx.lineWidth=1;
  for(let y=0;y<H;y+=8){cx.beginPath();cx.moveTo(mx,y);cx.lineTo(mx+10,y);cx.stroke()}
  for(let x=mx;x<=mx+10;x+=5){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
  cx.fillStyle=acc;
  for(const p of P){
    p.x+=p.v*(0.6+speed*5);
    if(p.x>W){p.x=-4;p.y=Math.random()*H}
    const passed=p.x>mx+10;
    cx.globalAlpha=passed?.85*(0.25+speed*.75):.7;
    const yy=p.y+Math.sin((p.x+p.y)/22)*(passed?1:3);
    cx.beginPath();cx.arc(p.x,yy,passed?p.r*.8:p.r,0,6.283);cx.fill();
  }
  cx.globalAlpha=1;
  if(!reduce)requestAnimationFrame(draw);
}
addEventListener("resize",size);

setTheme(S.theme);
buildPresets();build();drawHist();
$("#dec").value=S.dec;$("#area").value=S.area;
setMode(S.mode);
S.active="";mark();
size();draw();
</script>
</body>
</html>
